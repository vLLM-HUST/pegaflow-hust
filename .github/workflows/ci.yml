name: "CI"

on:
  push:
    branches:
      - "main"
      - "master"
  pull_request:
    branches:
      - "main"
      - "master"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # --------------------------------------------------------------------
  # P1: Fast pre-merge checks (no special hardware)
  # --------------------------------------------------------------------

  commit-check:
    name: commit message check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install commitizen
        run: pip install commitizen
      - name: Check last commit message
        run: cz check --rev-range HEAD~1..HEAD

  version-consistency-check:
    name: version consistency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Rust and Python package versions stay in sync
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          repo = pathlib.Path.cwd()
          cargo_toml = (repo / "Cargo.toml").read_text(encoding="utf-8")
          pyproject_toml = (repo / "python" / "pyproject.toml").read_text(encoding="utf-8")

          def find_section_version(text: str, section: str) -> str:
              match = re.search(
                  rf"(?ms)^\[{re.escape(section)}\]\n(.*?)(?:^\[|\Z)",
                  text,
              )
              if match is None:
                  raise SystemExit(f"missing section [{section}]")

              version_match = re.search(
                  r'^version = "([^"]+)"$',
                  match.group(1),
                  re.MULTILINE,
              )
              if version_match is None:
                  raise SystemExit(f"missing version in [{section}]")
              return version_match.group(1)

          rust_version = find_section_version(cargo_toml, "workspace.package")
          python_version = find_section_version(pyproject_toml, "project")
          commitizen_version = find_section_version(pyproject_toml, "tool.commitizen")

          if rust_version != python_version or python_version != commitizen_version:
              raise SystemExit(
                  "version mismatch: "
                  f"Cargo.toml={rust_version}, "
                  f"python/pyproject.toml project={python_version}, "
                  f"tool.commitizen={commitizen_version}"
              )

          print(f"version check passed: {rust_version}")
          PY

  typos-check:
    name: typos check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run typos check
        uses: crate-ci/typos@master

  rust-fmt-check:
    name: rust fmt check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Run rust format check
        run: |
          cargo fmt --all -- --check

  rust-clippy-check:
    name: rust clippy check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install protobuf compiler and RDMA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libibverbs-dev
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run rust clippy check
        run: |
          cargo clippy --workspace --exclude pegaflow-py --no-default-features --features ascend --lib

  ruff-check:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run ruff check
        uses: astral-sh/ruff-action@v3

  python-unit-tests:
    name: python unit tests
    runs-on: ubuntu-latest
    env:
      BENCHMARK_COLLECTION_ROOT: ${{ github.workspace }}/../benchmark-collection
      BENCHMARK_ISSUE28_SOURCE_ROOT: ${{ github.workspace }}/../benchmark-issue28-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: Run default Python test gate
        working-directory: python
        run: |
          python ../scripts/fetch_mod_consumer_evidence.py --config ../BENCHMARK_COLLECTION.json --destination "$BENCHMARK_COLLECTION_ROOT"
          python ../scripts/fetch_mod_consumer_evidence.py --config ../BENCHMARK_ISSUE28_SOURCE.json --destination "$BENCHMARK_ISSUE28_SOURCE_ROOT"
          uv run --isolated --no-project --with pytest --with numpy --with 'requests>=2.26.0' pytest
      - name: Run Issue23 preparation and analysis tests
        env:
          BENCHMARK_EVIDENCE_ROOT: ${{ runner.temp }}/benchmark-evidence
        run: |
          python scripts/fetch_mod_consumer_evidence.py --destination "$BENCHMARK_EVIDENCE_ROOT"
          uv run --isolated --no-project --with pytest --with httpx --with aiohttp \
            pytest scripts/issue23 -q
      - name: Audit frozen Issue23 pilot evidence
        run: |
          python scripts/fetch_mod_consumer_evidence.py --config BENCHMARK_HISTORY.json --destination "$RUNNER_TEMP/benchmark-history"
          python scripts/issue23/audit_archive.py \
            --archive "$RUNNER_TEMP/benchmark-history/results/issue23/20261012-attention-diagnostic" \
            --output "$RUNNER_TEMP/issue23-archive-review.json"
      - name: Audit frozen contention experiment evidence
        env:
          BENCHMARK_EVIDENCE_ROOT: ${{ runner.temp }}/benchmark-evidence
        run: |
          python scripts/issue23/verify_contention.py \
            --root "$BENCHMARK_EVIDENCE_ROOT/results/issue23/20261015-contention"

  ecpa-package:
    name: ECPA package contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package tools and pinned ECPA
        run: |
          python -m pip install build pytest tomli
          python -m pip install 'vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@4be9d2c502f8a41797bb068993eb91add29f3401'
          python -m pip install --no-deps --editable extension-provider
      - name: Validate runtime-owned Bundle and provider contract
        run: |
          python -m pytest -q python/tests/test_ecpa_bundle.py extension-provider/tests
      - name: Build and inspect provider wheel
        run: |
          python -m build extension-provider --outdir dist
          python -m venv /tmp/pegaflow-ecpa-provider
          /tmp/pegaflow-ecpa-provider/bin/pip install 'vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@4be9d2c502f8a41797bb068993eb91add29f3401'
          /tmp/pegaflow-ecpa-provider/bin/pip install --no-deps dist/vllm_hust_pegaflow_provider-*.whl
          test "$(VLLM_HUST_EXT_CONFIG=/tmp/pegaflow-ecpa-provider/config.json /tmp/pegaflow-ecpa-provider/bin/vllm-hust-ext extension list --json)" = '[]'

  ecpa-runtime-wheel:
    name: ECPA runtime metadata clean-wheel lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python -m pip install build 'maturin>=1.0,<2.0'
      - name: Build metadata-validation runtime and provider wheels
        run: |
          # GitHub-hosted x86 runners do not carry CANN. This link-only stub is
          # used solely to build an unpublished wheel whose Python package and
          # entry-point metadata are inspected below; the native module is
          # never imported or described as Ascend runtime evidence.
          mkdir -p /tmp/pegaflow-ascend-link-stub
          printf 'void pegaflow_ci_link_placeholder(void) {}\n' | \
            cc -shared -x c - -o /tmp/pegaflow-ascend-link-stub/libascendcl.so
          RUSTFLAGS='-L native=/tmp/pegaflow-ascend-link-stub' \
            LIBRARY_PATH=/tmp/pegaflow-ascend-link-stub \
            python -m maturin build --release --no-default-features --features ascend \
              --auditwheel skip --manifest-path python/Cargo.toml --out dist-runtime
          python -m build extension-provider --outdir dist-provider
      - name: Exercise clean-wheel ECPA lifecycle
        run: |
          python -m venv /tmp/pegaflow-ecpa-runtime
          /tmp/pegaflow-ecpa-runtime/bin/pip install 'vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@4be9d2c502f8a41797bb068993eb91add29f3401'
          /tmp/pegaflow-ecpa-runtime/bin/pip install dist-runtime/pegaflow_llm_npu-*.whl dist-provider/vllm_hust_pegaflow_provider-*.whl
          /tmp/pegaflow-ecpa-runtime/bin/python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path('/tmp/pegaflow-ecpa-runtime')
          cli = root / 'bin/vllm-hust-ext'
          config = root / 'config.json'
          profile = root / 'profile.json'
          profile.write_text(json.dumps({
              'grpc_endpoint': 'http://127.0.0.1:50055',
              'health_url': 'http://127.0.0.1:19091/health',
              'kv_role': 'kv_both',
          }))
          env = os.environ | {'VLLM_HUST_EXT_CONFIG': str(config)}

          def run(*args, check=True, extra_env=None):
              command_env = env | (extra_env or {})
              return subprocess.run(
                  [str(cli), *args],
                  check=check,
                  capture_output=True,
                  text=True,
                  env=command_env,
              )

          listed = json.loads(run('extension', 'list', '--json').stdout)
          assert len(listed) == 1
          assert listed[0]['bundle_id'] == 'org.vllm-hust.pegaflow'
          assert listed[0]['distribution'] == 'pegaflow-llm-npu'
          assert listed[0]['activation_ready'] is True
          run('extension', 'inspect', 'org.vllm-hust.pegaflow')
          run('extension', 'validate', 'org.vllm-hust.pegaflow')
          run('extension', 'configure', 'org.vllm-hust.pegaflow', '--file', str(profile))
          check = json.loads(run('extension', 'check', 'org.vllm-hust.pegaflow').stdout)
          assert check['states'] == [
              'installed', 'discovered', 'compatible', 'configured', 'degraded'
          ]
          run('extension', 'plan', 'org.vllm-hust.pegaflow')
          run('extension', 'render', 'org.vllm-hust.pegaflow')
          run('extension', 'enable', 'org.vllm-hust.pegaflow')
          rendered_env = json.loads(run(
              'extension', 'env',
              extra_env={'VLLM_PLUGINS': 'ascend,user_plugin,ascend'},
          ).stdout)
          assert rendered_env['VLLM_PLUGINS'] == 'ascend,user_plugin,pegaflow'
          refused = run('run', '--', '/bin/true', check=False)
          assert refused.returncode == 2
          assert "required service health is not verified" in refused.stderr
          run('extension', 'disable', 'org.vllm-hust.pegaflow')
          run('extension', 'forget', 'org.vllm-hust.pegaflow')
          PY
          /tmp/pegaflow-ecpa-runtime/bin/pip uninstall -y pegaflow-llm-npu
          test "$(VLLM_HUST_EXT_CONFIG=/tmp/pegaflow-ecpa-runtime/config.json /tmp/pegaflow-ecpa-runtime/bin/vllm-hust-ext extension list --json)" = '[]'

  # --------------------------------------------------------------------
  # P2: Ascend compile check (this project targets Ascend NPU only)
  # --------------------------------------------------------------------

  cargo-check-ascend:
    name: cargo check (ascend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install protobuf compiler and RDMA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libibverbs-dev
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run cargo check
        run: |
          cargo check --no-default-features --features ascend -p pegaflow-core -p pegaflow-server --lib
          cargo check --no-default-features --features ascend,rdma -p pegaflow-core -p pegaflow-server --lib --tests
        env:
          CUDA_PATH: /usr/local/cuda

  rdma-cpu-tests:
    name: RDMA CPU unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libibverbs-dev
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Test CPU pacing without device initialization
        run: |
          cargo test -p pegaflow-transfer --no-default-features --features ascend --lib rc_backend::pacing::tests

  step-simulator-evidence:
    name: step simulator and measured evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check out fixed calibration and validation evidence
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-benchmark
          ref: 26d6aad7736e0634ecca15cb592136c3802118d6
          path: .step-evidence
          sparse-checkout: reports/pegaflow-step-simulator-20261026
          persist-credentials: false
      - name: Check simulator state transitions and measured development cases
        run: |
          python -m pip install pytest
          python -m pytest -q scripts/issue23/test_step_simulator.py
          python scripts/issue23/verify_step_evidence.py \
            --root .step-evidence/reports/pegaflow-step-simulator-20261026

  cargo-check:
    name: cargo check
    if: always()
    needs: cargo-check-ascend
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.cargo-check-ascend.result }}" != "success" ]]; then
            echo "cargo check (ascend) failed"
            exit 1
          fi
